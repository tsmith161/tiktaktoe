<head>
    <style>
        .tttgrid {
			margin: 5% auto;

			display: grid;
            grid-template-columns: repeat(3, min(100px, 10vw));
			width: min(30vw, 300px);

  		    align-items: center;      /* vertical alignment */
  		    gap: 5px;  
		}
        .square {
            font-size: clamp(2.5rem, 8vw, 5.5rem);

            border-radius: 5px;
            border: 2px solid;
            border-color:black;

			width: min(10vw, 100px);
            aspect-ratio: 1/1;

            display: flex;
            align-items: center;
            justify-content: center;
		}

        .square:hover {
            background-color:greenyellow;
        }

        #winDisplay {
            border: 2px solid black;
            width: min(60vw, 600px);
            margin: 20px auto;
            padding: 10px;
            text-align: center;
            font-size: 1.25rem;
        }
        #turnDisplay {
            border: 2px solid black;
            width: min(60vw, 600px);
            margin: 20px auto;
            padding: 10px;
            text-align: center;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <h1>
        Welcome to TicTacToe
    </h1>
    <button id="startButton">Start Game</button>
    <div id = "turnDisplay">
        X's Turn
    </div>
    <div class = "tttgrid">
        <script>
            // initializing key variables
            turn = Math.random();
            start = false;
            const NUM_SQUARES = 9;

            ids = [0, 1, 2, 3, 4, 5, 6, 7, 8];

            // randomizing who begins first
            if (turn < .5) {
                turn = 0
                document.getElementById("turnDisplay").innerHTML = "X's Turn";
            } else {
                turn = 1;
                document.getElementById("turnDisplay").innerHTML = "O's Turn";
            }

            function squareClick(index) {
                // assigning value to box
                if (document.getElementById("sq" + index).innerHTML != "X" && document.getElementById("sq" + index).innerHTML != "O") {
                    if (turn == 0 && start) {
                        document.getElementById("sq" + index).innerHTML = "X";
                        document.getElementById("turnDisplay").innerHTML = "O's Turn";
                        turn = 1;
                    } else if (turn == 1 && start) {
                        document.getElementById("sq" + index).innerHTML = "O";
                        document.getElementById("turnDisplay").innerHTML = "X's Turn";
                        turn = 0;
                    }
                }

                // updating array representing state of the game
                moves = [];

                ids.forEach(id => {
                    if (document.getElementById("sq" + id).innerHTML == "X") {
                        moves.push("X");
                    } else if (document.getElementById("sq" + id).innerHTML == "O") {
                        moves.push("O");
                    } else {
                        moves.push("-");
                    }
                });

                // building possible win condition arrays
                winConditions = [];

                // 3 rows
                winConditions.push(moves[0] + moves[1] + moves[2]); // top row
                winConditions.push(moves[3] + moves[4] + moves[5]); // middle row
                winConditions.push(moves[6] + moves[7] + moves[8]); // bottom row

                // 3 columns
                winConditions.push(moves[0] + moves[3] + moves[6]); // left column
                winConditions.push(moves[1] + moves[4] + moves[7]); // middle column
                winConditions.push(moves[2] + moves[5] + moves[8]); // right column

                // 2 diagonals
                winConditions.push(moves[0] + moves[4] + moves[8]); // top-left to bottom-right
                winConditions.push(moves[2] + moves[4] + moves[6]);

                // Checks if any condition's state implies a win
                win = false;
                winConditions.forEach(str => {
                    if (str == "XXX") {
                        start = false;
                        win = true;
                        document.getElementById("winDisplay").innerHTML = "X WINS!";
                    } else if (str == "OOO") {
                        start = false;
                        win = true;
                        document.getElementById("winDisplay").innerHTML = "O WINS!";
                    }
                })

                // ensures further moves are possible
                let hasSpace = false;
                moves.forEach(slot => {
                    if (slot == "-") {
                        hasSpace = true;
                    }
                })

                // calls stalemate if no further moves are possible and no one has one
                if (!hasSpace && !win) {
                    start = false;
                    document.getElementById("winDisplay").innerHTML ="STALEMATE!";
                }
            }

            // initialize board
            for (i=0; i<NUM_SQUARES; i++)
            {
                id = "sq"+i;
                document.write( "<div class='square' id='" + id + "' onclick=' squareClick(" + i +")'></div>");
            }

            // restart and allow players to make moves
            function startGame() {
                for (i=0; i<NUM_SQUARES; i++)
                {
                    document.getElementById("sq" + i).innerHTML = "";
                }
                let moves = [];
                start = true;
                document.getElementById("winDisplay").innerHTML = "No winner yet";
            }

            // allows start button to call startGame
            document.getElementById("startButton").addEventListener("click", startGame);
        </script>
    </div>

    <div id="winDisplay">
        No winner yet
    </div>
</body>
