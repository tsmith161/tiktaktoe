<head>
    <style>
        .tttgrid {
			margin: 5% auto;

			display: grid;
            grid-template-columns: repeat(3, min(200px, 20vw));
			width: min(60vw, 600px);

  		    align-items: center;      /* vertical alignment */
  		    gap: 5px;  
		}
        .tttbox {
            font-size: clamp(5rem, 16vw, 8rem);

            border-radius: 5px;
            border: 2px solid;
            border-color:black;

			width: min(20vw, 200px);
            aspect-ratio: 1/1;

            display: flex;
            align-items: center;
            justify-content: center;
		}

        .tttbox:hover {
            background-color:greenyellow;
        }
    </style>
</head>
<body>
    <div class="tttgrid">
        <div class="tttbox">
            X
        </div>
        <div class="tttbox">
            
        </div>
